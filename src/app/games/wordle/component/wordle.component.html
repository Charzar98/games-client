<div class="wordle-container">
  <div class="wordle-header">
    <mat-form-field>
      <mat-label>Letter Count (3 - 10)</mat-label>
      <input matInput type="number" [formControl]="letterCount">
    </mat-form-field>
    <button mat-button
            [disabled]="letterCount.invalid"
            (click)="getRandomWord(letterCount.value)">
      Generate Word
    </button>
  </div>

  @if (wordleFormGroup) {
    <div class="word-container">
      <div class="word-row" appWordleRowDirective (emitEnter)="guessWord()">
        @for (letter of wordleFormGroup.controls.guessedLetters.controls; track $index;) {
          <div class="letter-container" @elementEnter>
            <input id="letter-input" class="letter-input" [@guessLetterAnimation]="letter.controls.letterState.value"
                   [maxLength]="1"
                   [disabled]="wordleFormGroup.controls.numberOfGuesses.invalid"
                   [formControl]="letter.controls.letterValue"
                   (input)="validateInput(letter)">
          </div>
        }
      </div>

      <div class="button-container">
        <button mat-button
                [disabled]="wordleFormGroup.invalid"
                (click)="guessWord()">
          Guess
        </button>
        <button mat-button
                [disabled]="wordleFormGroup.controls.numberOfGuesses.invalid"
                (click)="clearInputs()">
          Clear
        </button>
        <button mat-button *ngIf="wordleFormGroup.controls.numberOfGuesses.invalid"
                (click)="navigateToDictionaryLinkInNewTab()">
          Go to Definition
        </button>
      </div>
    </div>

    <div class="keyboard-letter-container" @elementEnter>
      @for (row of keyboardLetters; track $index) {
        <div class="keyboard-letter-row">
          @for (letter of row; track $index) {
            <div class="keyboard-letter" [@guessLetterAnimation]="triggerAnimationSignal() ? animationTrigger(letter, wordleFormGroup.controls.guessedLetters.controls) : null">{{ letter }}</div>
          }
        </div>
      }
    </div>
    <div>Guesses Left: {{ wordleFormGroup.controls.numberOfGuesses.value }}</div>
  }
</div>
